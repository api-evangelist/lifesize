aid: lifesize
name: Lifesize
description: 'Lifesize is a video conferencing and meeting-room platform — cloud meeting
  service (Lifesize Cloud), Icon conference-room systems, the Lifesize Share wireless
  presentation appliance, Phone HD, and the web/desktop/mobile apps — originally founded
  in Austin, Texas. Lifesize merged with contact-center provider Serenova (CxEngage)
  in 2020 and was acquired by Enghouse Systems in 2023; the video business now operates
  as Enghouse Video (Vidyo Inc.) and the Lifesize brand and product line continue under
  enghousevideo.com/lifesize. The developer surface is an on-device automation API on
  the Lifesize Icon series: a REST interface and a Lifesize Automation Command Line
  Interface (CLI) reachable over HTTPS or SSH with administrator credentials, both
  self-documenting on the device itself, used to read configuration, change system
  preferences, report call status and statistics, and control calls. Lifesize also
  runs a hosted cloud service API host and publishes chat (Slack, Microsoft Teams) and
  calendar (Google Workspace, Microsoft 365) integrations, dated release notes, and an
  Atlassian-hosted status page.'
