- aid: lifesize:cloud-api
  name: Lifesize Cloud API
  description: 'The hosted service API behind the Lifesize Cloud meeting service, the
    Lifesize Admin Console, and the web/desktop/mobile applications. The host is live
    and serves JSON from an AWS API Gateway edge, returning HTTP 403 to unauthenticated
    callers; Lifesize does not publish a public developer portal or reference for it,
    so this entry records the observed production host and the administrative surfaces
    that consume it rather than a documented contract.'
  humanURL: https://admin.lifesizecloud.com/
