apis:
- aid: lifesize:icon-automation-api
  name: Lifesize Icon Automation API
  description: 'The automation and control interface built into Lifesize Icon video
    systems (models 300, 400, 450, 500, 600, 700, 800). It exposes a REST method for
    accessing a set of resources through a fixed set of operations, plus the Lifesize
    Automation Command Line Interface (CLI) for command-based control. Reachable over
    an HTTPS or SSH connection to the system on the network, authenticated with the
    same administrator credentials used for browser access. The API is self-documenting
    on the device: the REST reference is served at /docs/json and the CLI reference at
    /docs/clish. Commands take the form "<actor> <command> <parameters>" and cover
    retrieving configuration (system version, camera settings), modifying preferences
    (speaker volume, bandwidth, auto-answer), displaying call status and statistics,
    and controlling calls (adding participants, emulating remote-control functions).'
  humanURL: https://support.lifesize.com/product/lifesize-icon-400-450-600-800/advanced-topics/api-overview/
  baseURL: https://{videoSystemIPAddress}/docs/json
